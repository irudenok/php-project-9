services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: php-project-9
    container_name: php-project-9
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "80:8000"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=php_project_9
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - DATABASE_URL=postgresql://postgres:secret@db:5432/php_project_9
    depends_on:
      - db
    networks:
      - php-project-9-network

  # PostgreSQL Service
  db:
    image: postgres:15
    container_name: php-project-9-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: php_project_9
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Если есть кастомные конфиги PostgreSQL, раскомментируйте:
      # - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - php-project-9-network

volumes:
  dbdata:
    driver: local

networks:
  php-project-9-network:
    driver: bridge