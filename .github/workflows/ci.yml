# Name of workflow
name: PHP CI

# Trigger the workflow on push or pull request
on:
  - push
  - pull_request

jobs:
  build:

    # The type of machine to run the job on
    runs-on: ubuntu-latest

    steps:
        # Check-out repository under GitHub workspace
        # https://github.com/actions/checkout
      - uses: actions/checkout@v4
        # Step's name
      - name: Setup PHP
        # Action gives to setup the PHP environment to test application
        # https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@v2
        with:
          # Specify the PHP version
          php-version: '8.4'
      - name: Install
        # Install project
        run: make install
      - name: Run linter
        # Run Linter
        run: make lint

        # https://docs.sonarsource.com/sonarqube-cloud/enriching/test-coverage/php-test-coverage/
      # - name: Run tests
      #   run: make test-coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e46ed76b9c4f0c0f3c60a2d9e5c9d8d5b8c3a3f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # NOTE: https://sonarcloud.io/project/information?id=hexlet-boilerplates_php-package
          args: >
            -Dsonar.projectKey=irudenok_php-project-9
            -Dsonar.organization=irudenok
            -Dsonar.sources=src/
            -Dsonar.php.coverage.reportPaths=build/logs/clover.xml